name: Deploy Flutter Web to GitHub Pages
on:
 push:
   branches: ["main"]
 workflow_dispatch:
permissions:
 contents: read
 pages: write
 id-token: write
concurrency:
 group: "pages"
 cancel-in-progress: false
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout
       uses: actions/checkout@v4
     - name: Setup Flutter
       uses: subosito/flutter-action@v2
       with:
         channel: stable
     - name: Get dependencies
       run: flutter pub get
     - name: Build Flutter Web
       run: flutter build web --release --base-href "/bienenplan_frontend/" --dart-define=API_SERVER_BASE_URL=https://mulled-custodian-patriot.ngrok-free.dev
     - name: Setup Pages
       uses: actions/configure-pages@v5
     - name: Upload Flutter Web
       uses: actions/upload-pages-artifact@v3
       with:
         path: build/web
 deploy:
   runs-on: ubuntu-latest
   needs: build
   environment:
     name: github-pages
     url: ${{ steps.deployment.outputs.page_url }}
   steps:
     - name: Deploy to GitHub Pages
       id: deployment
       uses: actions/deploy-pages@v5
